# slime spawn buff(runs a random chance for a slime to spawn with a mob)
# slimeChanceEnabled needs to be true for slimeChance to take effect
# default: 0.01(1%)

slimeChanceEnabled: true
slimeChance: 0.01

# quantity of raiders to be added to the raid, default adds 1 raider of the same type per existing raider

raiderQuantity: 1

# zombie iron drop buff
# zombieIronEnabled needs to be true for zombieIron to take effect
# default: 0.1(10%)

zombieIronEnabled: true
zombieIron: 0.1

# chance to spawn a warden
wardenChanceEnabled: false
wardenChance: 0.001

# warden buff keeping 1.8 combat as hard as 1.9
# health x1.73 restores time-to-kill lost to the faster 1.8 hit rate
# damage x2.8 offsets 1.8 armour absorbing a flat 80%
wardenBuffEnabled: true
wardenHealthMultiplier: 1.73
wardenAttackDamageMultiplier: 2.8
